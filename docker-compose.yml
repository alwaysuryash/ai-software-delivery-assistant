services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: aisda_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aisda}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aisda_dev_pw}
      POSTGRES_DB: ${POSTGRES_DB:-aisda}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aisda}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: aisda_redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  redisdata:
